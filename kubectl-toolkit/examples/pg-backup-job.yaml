apiVersion: batch/v1
kind: Job
metadata:
  name: pg-backup-mydatabase
spec:
  ttlSecondsAfterFinished: 86400  # Remove finished job after 1 day
  backoffLimit: 3
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: toolkit
          image: registry.jetbrains.team/p/kitd/public/kubectl-toolkit:latest
          command: ["/bin/psql-backup"]
          envFrom:
            - secretRef: # db secret
                name: database-admin-user # secret to database admin user. Important: it should be admin for pg
            - secretRef: # bucket secret
                name: bucket-user # secret to bucket with RW permissions
          env:
            - name: BACKUP_PREFIX # prefix in the bucket for a backup file
              value: backups/sre-test2/
            - name: BACKUP_FILE     # set backup file name, by default it is (may contain prefix too)
              value: my-backup-file-name # backup will be stored as $BACKUP_PREFIX/$BACKUP_FILE.dump.gz
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          ephemeral:
            volumeClaimTemplate:
              spec:
                accessModes: [ "ReadWriteOnce" ]
                resources:
                  requests:
                    storage: 50Gi # provide suitable size